<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Enhanced gradient (more diamond-like cool tones) -->
    <linearGradient id="main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"></stop>
      <stop offset="50%" stop-color="#38bdf8"></stop>
      <stop offset="100%" stop-color="#4f46e5"></stop>
    </linearGradient>

    <!-- Bright highlight -->
    <linearGradient id="highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"></stop>
      <stop offset="100%" stop-color="#bae6fd"></stop>
    </linearGradient>

    <!-- Shadow for depth -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.2"></feDropShadow>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- ORIGINAL SHAPE (unchanged) -->
    <path d="M32 4 L56 24 L32 60 L8 24 Z" fill="url(#main)" stroke="#ffffff" stroke-width="1.2"></path>

    <!-- Left facet (brighter like light hitting diamond) -->
    <path d="M32 4 L32 60 L8 24 Z" fill="url(#highlight)" opacity="0.9"></path>

    <!-- Right facet (slightly darker contrast) -->
    <path d="M32 4 L56 24 L32 60 Z" fill="#0ea5e9" opacity="0.45"></path>

    <!-- Top facet highlight (adds diamond feel) -->
    <path d="M32 4 L44 20 L20 20 Z" fill="#ffffff" opacity="0.35"></path>

    <!-- Subtle internal facet lines -->
    <line x1="32" y1="4" x2="32" y2="60" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1"></line>

    <line x1="8" y1="24" x2="56" y2="24" stroke="#ffffff" stroke-opacity="0.25" stroke-width="0.8"></line>

    <line x1="20" y1="42" x2="44" y2="42" stroke="#ffffff" stroke-opacity="0.2" stroke-width="0.6"></line>
  </g>
</svg>